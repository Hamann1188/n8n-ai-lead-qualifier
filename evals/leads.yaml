# 40 synthetic leads for the fictional Registan Smile Clinic, labelled by hand.
# All leads arrive on Monday 2026-10-12 at 10:15 (Asia/Tashkent).
#
# tier:   the expected tier; alt: other tiers that are also acceptable (borderline cases)
# lang:   the language of the message
# expect: contact details the output must contain (email: exact, case-insensitive;
#         phone: the last 9 digits; name and company: a case-insensitive substring)
# checks: not_tier (tiers the lead must never get), reply_excludes (text the
#         suggested reply must not contain)

